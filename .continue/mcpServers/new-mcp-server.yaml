name: New MCP server
version: 0.0.1
schema: v1
mcpServers:
  - name: filesystem
    command: npx
    args:
      - -y
      - "@modelcontextprotocol/server-filesystem"
      - D:/Development/Sources/Fun/aiDoom
    env: {}
    connectionTimeout: 30000

  - name: git
    command: uvx
    args:
      - mcp-server-git
    cwd: D:/Development/Sources/Fun/aiDoom
    env: {}
    connectionTimeout: 30000

  - name: memory
    command: npx
    args:
      - -y
      - "@modelcontextprotocol/server-memory"
    env: {}
    connectionTimeout: 30000
